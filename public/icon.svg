<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 背景グラデーション -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- プレートグラデーション -->
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2600f"/>
    </linearGradient>
    <!-- バーグラデーション（中央を明るく） -->
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2600f"/>
    </linearGradient>
    <!-- カラーグラデーション（少し暗め） -->
    <linearGradient id="collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#9a4d0c"/>
    </linearGradient>
    <!-- 光沢ハイライト -->
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 背景（スクワークル形状） -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- 左アウタープレート -->
  <rect x="48" y="181" width="74" height="150" rx="16" fill="url(#plate)"/>
  <!-- 左プレートのハイライト -->
  <rect x="48" y="181" width="74" height="75" rx="16" fill="url(#shine)"/>

  <!-- 左カラー（固定リング） -->
  <rect x="122" y="208" width="38" height="96" rx="10" fill="url(#collar)"/>

  <!-- バー（中央） -->
  <rect x="160" y="234" width="192" height="44" rx="10" fill="url(#bar)"/>
  <!-- バーのハイライト -->
  <rect x="160" y="234" width="192" height="22" rx="10" fill="url(#shine)"/>

  <!-- 右カラー（固定リング） -->
  <rect x="352" y="208" width="38" height="96" rx="10" fill="url(#collar)"/>

  <!-- 右アウタープレート -->
  <rect x="390" y="181" width="74" height="150" rx="16" fill="url(#plate)"/>
  <!-- 右プレートのハイライト -->
  <rect x="390" y="181" width="74" height="75" rx="16" fill="url(#shine)"/>
</svg>
